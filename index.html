<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Personal Wealth</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#064e3b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>Wealth Dashboard</h1>
            <p class="subtitle">ความมั่งคั่งสุทธิ</p>
            <h2 class="net-worth" id="netWorth">฿ 0.00</h2>
            
            <!-- [เพิ่มใหม่] ปุ่มสำหรับล็อกอินและออกจากระบบ Google -->
            <div class="auth-container" style="margin-top: 15px;">
                <button id="authorize_button" class="nav-btn" style="display: none; width: auto; padding: 5px 15px; margin: 0 auto; border-radius: 20px;">ล็อกอินด้วย Google</button>
                <button id="signout_button" class="nav-btn" style="display: none; width: auto; padding: 5px 15px; margin: 0 auto; border-radius: 20px; background-color: #ef4444; color: white;">ออกจากระบบ</button>
            </div>
        </header>

        <main class="content">
            <section class="card">
                <h3>รายการล่าสุด</h3>
                <ul class="transaction-list" id="transactionList">
                    <li class="transaction-item">
                        <div class="tx-details">
                            <span class="tx-title">เงินเดือน</span>
                            <span class="tx-date">1 ก.ค. 2026</span>
                        </div>
                        <span class="tx-amount positive">+ ฿0.00</span>
                    </li>
                </ul>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="เมนูหลัก">
            <button class="nav-btn active" type="button">แดชบอร์ด</button>
            <button class="nav-btn fab-btn" id="addBtn" type="button" aria-label="เพิ่มรายการ">+</button>
            <button class="nav-btn" type="button">ตั้งค่า</button>
        </nav>
    </div>

    <!-- ========================================== -->
    <!-- [เริ่ม] ส่วนที่ต้องแทรกเพิ่ม: โครงสร้าง Bottom Sheet -->
    <!-- ========================================== -->
    <div class="modal-overlay" id="overlay"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <!-- หน้า 1: เลือกประเภทรายการ -->
        <div id="typeSelection">
            <div class="header-flex">
                <h3>เลือกประเภทที่ต้องการบันทึก</h3>
                <button class="btn-close" type="button" onclick="closeSheet()">×</button>
            </div>
            <div class="menu-option" onclick="openForm('transactionForm')">รายรับ-รายจ่าย ประจำวัน <span>></span></div>
            <div class="menu-option" onclick="openForm('investmentForm')">บันทึกการลงทุน <span>></span></div>
            <div class="menu-option" onclick="openForm('assetForm')">บันทึกทรัพย์สินรายการใหม่ <span>></span></div>
        </div>

        <!-- หน้า 2.1: ฟอร์มรายรับ-รายจ่าย -->
        <div id="transactionForm" class="form-container" style="display: none;">
            <div class="header-flex">
                <h3>รายรับ-รายจ่าย</h3>
                <button class="btn-close" type="button" onclick="closeSheet()">×</button>
            </div>
            <form onsubmit="submitData(event, 'Transactions')">
                <div class="form-group"><label>วันที่</label><input type="date" name="date" required></div>
                <div class="form-group">
                    <label>ประเภท</label>
                    <select name="type">
                        <option value="Income">รายรับ</option>
                        <option value="Expense">รายจ่าย</option>
                    </select>
                </div>
                <div class="form-group"><label>หมวดหมู่</label><input type="text" name="category" placeholder="เช่น อาหาร, เงินเดือน"></div>
                <div class="form-group"><label>จำนวนเงิน (บาท)</label><input type="number" name="amount" placeholder="0.00" required></div>
                <div class="form-group"><label>บันทึกช่วยจำ</label><input type="text" name="note" placeholder="รายละเอียดเพิ่มเติม"></div>
                <button type="submit" class="btn-submit">บันทึกข้อมูล</button>
            </form>
        </div>

        <!-- หน้า 2.2: ฟอร์มการลงทุน -->
        <div id="investmentForm" class="form-container" style="display: none;">
            <div class="header-flex">
                <h3>บันทึกการลงทุน</h3>
                <button class="btn-close" type="button" onclick="closeSheet()">×</button>
            </div>
            <form onsubmit="submitData(event, 'Investments')">
                <div class="form-group"><label>ชื่อสินทรัพย์</label><input type="text" name="asset_name" required></div>
                <div class="form-group"><label>จำนวนหน่วย</label><input type="number" step="0.01" name="units" required></div>
                <div class="form-group"><label>ต้นทุนเฉลี่ย</label><input type="number" step="0.01" name="avg_cost" required></div>
                <div class="form-group">
                    <label>ลดหย่อนภาษีได้</label>
                    <select name="tax_deductible"><option value="No">ไม่ใช่</option><option value="Yes">ใช่</option></select>
                </div>
                <button type="submit" class="btn-submit">บันทึกข้อมูล</button>
            </form>
        </div>

        <!-- หน้า 2.3: ฟอร์มทรัพย์สิน -->
        <div id="assetForm" class="form-container" style="display: none;">
            <div class="header-flex">
                <h3>ทรัพย์สินรายการใหม่</h3>
                <button class="btn-close" type="button" onclick="closeSheet()">×</button>
            </div>
            <form onsubmit="submitData(event, 'Assets')">
                <div class="form-group"><label>ชื่อทรัพย์สิน</label><input type="text" name="asset_name" required></div>
                <div class="form-group"><label>หมวดหมู่</label><input type="text" name="category" placeholder="เช่น อสังหาฯ, ยานพาหนะ"></div>
                <div class="form-group"><label>ราคาที่ซื้อมา</label><input type="number" name="purchase_price" required></div>
                <div class="form-group"><label>มูลค่าประเมินปัจจุบัน</label><input type="number" name="estimated_value"></div>
                <button type="submit" class="btn-submit">บันทึกข้อมูล</button>
            </form>
        </div>
    </div>
    <!-- ========================================== -->
    <!-- [จบ] ส่วนที่แทรกเพิ่ม -->
    <!-- ========================================== -->
    

    <!-- [เพิ่มใหม่] นำเข้าไลบรารี Google API (gapi) และ Identity Services (gsi) -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- เรียกใช้ไฟล์ JavaScript ของเรา -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
